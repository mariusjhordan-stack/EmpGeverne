<!doctype html>
<meta charset="utf-8">
<title>Render de productos 3D</title>
<body style="margin:0;background:#333;color:#eee;font:14px system-ui">
<p id="log" style="position:fixed;top:8px;left:8px;margin:0">listo</p>
<script type="module">
// Renders 3D de cada reloj (frente, detalle y perfil) con el modelo de la prueba virtual.
// Uso: con `npm run dev`, abrir /tools/render-products.html y ejecutar `await all()` en la consola.
// La lista sale de backend/scripts/render_queue.json (scripts/make_render_queue.py la arma con todos los relojes)
// y cada foto se guarda en backend/media/watches/3d/<file>-<vista>.webp, reemplazando la anterior.
import * as THREE from 'three';
import { studioEnvironment } from '/src/tryon/studio.js';
import { buildWatch, disposeWatch } from '/src/tryon/watchModel.js';
const W = 1200, H = 1500, SS = 2; // se dibuja al doble y se reduce: bordes limpios, sin dientes
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(SS); r.setSize(W, H, false); r.domElement.style.cssText = 'height:100vh';
document.body.append(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.12;
const env = studioEnvironment(r, { style: 'product' });
// El mismo fondo marfil con sombra suave que los renders del proyecto Java.
const bg = document.createElement('canvas'); bg.width = W * SS; bg.height = H * SS; const c = bg.getContext('2d');
c.scale(SS, SS);
const g = c.createRadialGradient(W * .5, H * .42, 60, W * .5, H * .5, H * .75);
g.addColorStop(0, '#fbf8f2'); g.addColorStop(.6, '#ece5d8'); g.addColorStop(1, '#d3c8b4'); c.fillStyle = g; c.fillRect(0, 0, W, H);
c.save(); c.filter = 'blur(38px)'; c.fillStyle = 'rgba(60,48,28,.38)'; c.beginPath(); c.ellipse(W * .53, H * .855, 300, 34, 0, 0, 7); c.fill(); c.restore();
c.save(); c.filter = 'blur(14px)'; c.fillStyle = 'rgba(40,32,20,.22)'; c.beginPath(); c.ellipse(W * .52, H * .85, 180, 12, 0, 0, 7); c.fill(); c.restore();
const bt = new THREE.CanvasTexture(bg); bt.colorSpace = THREE.SRGBColorSpace;
const out = document.createElement('canvas'); out.width = W; out.height = H;
const log = (t) => { document.getElementById('log').textContent = t; };

/** Una foto del reloj en una vista; devuelve el webp sin guardarlo. */
window.shot = async (p, view) => {
  const s = new THREE.Scene(); s.background = bt; s.environment = env;
  const k = new THREE.DirectionalLight(0xffffff, .75); k.position.set(-60, 90, 140); s.add(k);
  const w = await buildWatch(p); w.getObjectByName('wrist').visible = false; w.getObjectByName('shadow').visible = false; s.add(w);
  const V = { hero: [-.32, -.42, .06, 88], detail: [-.22, -.2, .03, 54], side: [-.3, .85, .08, 84] }[view];
  w.rotation.set(V[0], V[1], V[2]);
  const cam = new THREE.PerspectiveCamera(24, W / H, 10, 3000); cam.position.z = V[3] / (2 * Math.tan(.2094)); cam.updateProjectionMatrix();
  const b = new THREE.Box3().setFromObject(w); const m = b.getCenter(new THREE.Vector3());
  if (view !== 'detail') w.position.sub(m); else w.position.z = -22;
  cam.position.z += view === 'detail' ? 15 : 20;
  await document.fonts.ready; r.render(s, cam); // buildWatch ya esperó al GLB y sus texturas
  const o = out.getContext('2d'); o.imageSmoothingQuality = 'high'; o.drawImage(r.domElement, 0, 0, W, H);
  const blob = await new Promise((x) => out.toBlob(x, 'image/webp', .92));
  disposeWatch(w);
  return blob;
};
window.go = async (p, view) => {
  const blob = await shot(p, view);
  const res = await fetch(`/__save-render?name=${p.file ?? p.slug}-${view}.webp`, { method: 'POST', body: blob });
  if (!res.ok) throw new Error(`no se guardó ${p.file ?? p.slug}-${view}`);
  return blob.size;
};
window.queue = async () => (await fetch('/__render-queue')).json();
window.all = async (views = ['hero', 'detail', 'side'], only) => {
  let list = await queue();
  if (only) list = list.filter((p) => only.includes(p.slug));
  let n = 0;
  for (const p of list) for (const v of views) { log(`${++n}/${list.length * views.length} ${p.slug} ${v}`); await go(p, v); }
  log(`listo: ${n} imágenes`); return n;
};
window.ready = 1;
</script>
